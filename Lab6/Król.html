<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Wariant 12 - Biały Król</title>
<style>
    body { margin: 0; overflow: hidden; background-color: #222; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 15, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
directionalLight.position.set(10, 20, 10);
directionalLight.castShadow = true;
scene.add(directionalLight);

const spotLight = new THREE.SpotLight(0xffa95c, 2);
spotLight.position.set(-10, 10, 10);
scene.add(spotLight);

const kingGroup = new THREE.Group();
scene.add(kingGroup);

const whiteMaterial = new THREE.MeshStandardMaterial({ 
    color: 0xffffff, 
    roughness: 0.1,
    metalness: 0.2
});

const points = [];
points.push(new THREE.Vector2(0, 0));       // Środek podstawy
points.push(new THREE.Vector2(3.5, 0));     // Krawędź podstawy
points.push(new THREE.Vector2(3.5, 0.5));   // Pionowa krawędź
points.push(new THREE.Vector2(3.0, 1.0));   // Skos
points.push(new THREE.Vector2(3.2, 1.2));   // Wybrzuszenie bazy
points.push(new THREE.Vector2(3.2, 1.5));   // Wybrzuszenie bazy 2
points.push(new THREE.Vector2(2.3, 2.0));   // Wybrzuszenie przed zwężeniem
points.push(new THREE.Vector2(2.1, 2.3));   // Wybrzuszenie przed zwężeniem

points.push(new THREE.Vector2(1.8, 2.0));   // Zwężenie (początek tułowia)
points.push(new THREE.Vector2(1.5, 4.0));   // Środek tułowia 
points.push(new THREE.Vector2(1.5, 7.0));   // Środek tułowia cz 2
points.push(new THREE.Vector2(1.8, 7.5));   // Rozszerzenie pod kołnierzem

points.push(new THREE.Vector2(2.8, 7.8));   // Kołnierz dolny
points.push(new THREE.Vector2(2.9, 8.0));   // Kołnierz dolny środek
points.push(new THREE.Vector2(2.8, 8.2));   // Kołnierz dolny

points.push(new THREE.Vector2(2.0, 8.3));   // małe zwężenie kołnierza

points.push(new THREE.Vector2(2.5, 8.4));   // Kołnierz górny
points.push(new THREE.Vector2(2.6, 8.6));   // Kołnierz górny środek
points.push(new THREE.Vector2(2.5, 8.8));   // Kołnierz górny


points.push(new THREE.Vector2(1.8, 9.0));   // Szyja pod głową
points.push(new THREE.Vector2(2.5, 11.2));  // Głowa krągłość max
points.push(new THREE.Vector2(1.5, 11.5));  // Czubek głowy zwężenie
points.push(new THREE.Vector2(1.0, 11.7));  // Czubek głowy góra
points.push(new THREE.Vector2(1.0, 11.9));  // Czubek głowy góra 2

points.push(new THREE.Vector2(0, 12));    // Zamknięcie

const latheGeometry = new THREE.LatheGeometry(points, 64);
const kingBody = new THREE.Mesh(latheGeometry, whiteMaterial);
kingBody.castShadow = true;
kingGroup.add(kingBody);


const crossVertGeo = new THREE.BoxGeometry(0.6, 2.0, 0.6);
const crossVert = new THREE.Mesh(crossVertGeo, whiteMaterial);
crossVert.position.set(0, 12.6, 0);
crossVert.castShadow = true;
kingGroup.add(crossVert);

const crossHorizGeo = new THREE.BoxGeometry(1.6, 0.5, 0.6);
const crossHoriz = new THREE.Mesh(crossHorizGeo, whiteMaterial);
crossHoriz.position.set(0, 12.8, 0);
crossHoriz.castShadow = true;
kingGroup.add(crossHoriz);

kingGroup.position.y = -6;

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    kingGroup.rotation.y += 0.005; 
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</head>
<body>
</body>
</html>
